# CodeQL (GitHub) analyse le code TypeScript à la recherche de failles connues
# (injection, XSS, secrets en dur…). Les résultats apparaissent dans l'onglet Security du dépôt.
# Gratuit pour les dépôts publics.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # chaque lundi : de nouvelles règles peuvent révéler d'anciens problèmes

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyse CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
