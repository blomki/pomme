# Met à jour les images de référence des tests visuels, sur la branche d'une pull request.
# Deux façons de le lancer, quand un changement d'écran est voulu ou qu'un écran est nouveau :
# - ajouter l'étiquette « captures » à la pull request (le plus simple) ;
# - onglet Actions › « Mettre à jour les captures » › Run workflow, en choisissant la branche.
# Les images sont produites ici, dans le même environnement que la CI, pour être comparables.
# Ensuite, relancer la CI de la pull request (Re-run jobs) : un commit fait par GitHub Actions
# ne relance pas la CI tout seul.
name: Mettre à jour les captures

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: write

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  update:
    name: Régénérer les captures de référence
    runs-on: ubuntu-latest
    # Jamais directement sur main ; pour une PR, seulement avec l'étiquette « captures »
    # et si la branche est dans ce dépôt (pas une copie extérieure).
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.label.name == 'captures' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pomme
          POSTGRES_PASSWORD: pomme_ci
          POSTGRES_DB: pomme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pomme -d pomme"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgres://pomme_app:pomme_app_ci@localhost:5432/pomme
      DATABASE_MIGRATION_URL: postgres://pomme:pomme_ci@localhost:5432/pomme
      POMME_DEMO_PAGES: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:setup && pnpm db:migrate && pnpm db:seed
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:visual:update
        env:
          CI: "true"
      - name: Commiter les nouvelles références
        run: |
          git add tests/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "Aucune capture modifiée."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(visuel): mettre à jour les captures de référence"
          git push
