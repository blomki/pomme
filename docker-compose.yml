# Services de développement local. L'application elle-même tourne directement dans WSL (pnpm dev).
# Démarrer : pnpm db:up — Arrêter : pnpm db:down — Tout effacer et recréer : pnpm db:reset
services:
  postgres:
    image: postgres:17-alpine # même version majeure qu'en production
    environment:
      # Compte propriétaire de la base : sert aux migrations et au jeu de données fictif.
      # L'application, elle, se connecte avec le rôle restreint pomme_app (voir ADR 0003).
      POSTGRES_USER: pomme
      POSTGRES_PASSWORD: pomme_dev
      POSTGRES_DB: pomme
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pomme -d pomme"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Boîte de réception de test : capte tous les emails envoyés en local (aucun ne part vraiment).
  # Lire les emails : http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025" # SMTP, utilisé par l'application
      - "8025:8025" # interface web

  # Stockage des fichiers déposés (photos, logos ; fiche S11), compatible S3 comme Cellar chez
  # Clever Cloud. SeaweedFS plutôt que MinIO, qui ne publie plus d'image Docker depuis fin 2025.
  # Identifiants et lecture publique : docker/seaweedfs-s3.json. Préparer le bucket : pnpm files:setup
  files:
    image: chrislusf/seaweedfs:3.97
    command: server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333" # API S3, et lecture des images par le navigateur
    volumes:
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
      - files:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/ || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  files:
